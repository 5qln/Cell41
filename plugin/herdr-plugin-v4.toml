# ─────────────────────────────────────────────────────────────────────────────
# v4 (2026-08-24, §B of AGREED-PLAN-ADDRESSING-v2) — NODE-LOCAL CENTRE (R4).
# The ONLY change from v3: the podium command's centre path is now RELATIVE
# ("./question.md"). The node is selected by the cwd passed to plugin.pane.open
# (proven 2026-08-24: --cwd honoured outside plugin_root, PROBE-RESULT-S7). One
# manifest now serves every node at every depth; the seal argv (watch, no shell)
# is byte-identical — the seal proof carries over unchanged.
# PLACEMENT ONLY: this file is NOT to be linked in §B. The live podium keeps its
# current absolute argv until §D's attested window (sibling catch #1, accepted).
# ─────────────────────────────────────────────────────────────────────────────

# ── identity (flat, and the identity key is `id` — settled by the parser itself) ──────
# `id` is what the TOML parse model requires; the API reports the same value back as
# `plugin_id` in InstalledPluginInfo. Do not add a second `plugin_id` key here: the parser
# ignores keys it does not know, so it would sit in the file looking authoritative and
# meaning nothing. One name in, one name out, and this comment is the bridge between them.
id                = "cell.fiveqln"
name              = "The Cell — 4+1"
version           = "1.0.0"
description       = "The 4+1 cell as a Herdr instrument: a sealed podium holding the human's question, four free desks G·Q·P·V, and the actions that raise, plant, attest and descend."
min_herdr_version = "0.8.2"   # must be <= 0.8.2 (binary carries the literal threshold)
platforms         = ["linux"] # PluginPlatform enum: linux | macos | windows

# ── the podium: the sealed center ───────────────────────────────────────────
# PluginManifestPane: id* · title* · command* · description · placement · width · height · platforms
# v4: the argv keeps the attested PROPERTY — one foreground `watch`, no shell — while the path is
# now RELATIVE (./question.md). The absolute path that was verified on the live interim podium via
# pane.process_info moved into the pane's cwd (R4); the seal proof is unchanged because the
# process and its shape are unchanged. It renders the node's own question.md ONLY.
# NO width/height: they are popup-only (see "ONE CATCH" above).
[[panes]]
id          = "podium"
title       = "THE TRAIL"
command     = ["watch", "-n", "2", "/home/deploy/the-cell/plugin/bin/cell-podium", "--ledger", "/home/deploy/the-cell/state/gates.jsonl", "--trail", "/home/deploy/the-cell/state/trail.jsonl"]
placement   = "split"
description = "SEALED. The live formation trail — written by the engine's /conduct, read here only, one event per line. Absent trail reads INCONCLUSIVE, never a stand-in. No shell lives here."

# ── the actions: the score's four gestures ──────────────────────────────────
# PluginManifestAction: id* · title* · command* · description · contexts · platforms
# PluginActionContext enum (verified): global | workspace | tab | pane | selection
# Every command is an absolute path inside plugin_root/bin — nothing depends on cwd.

# begin — raise the cell. Machine-invokable (a free corner gesture).
# Resolves the workspace by LABEL "the-cell"; REFUSES to re-apply a layout over a
# cell that is already standing (layout.apply replaces the tab and would kill the
# plugin podium). Never passes focus:true. Never names w1. Boots no agents.
[[actions]]
id          = "begin"
title       = "Begin — raise the cell"
command     = ["/home/deploy/the-cell/plugin/bin/cell-begin"]
contexts    = ["global"]
description = "Raise the 4+1 cell in its own workspace: podium + desks G·Q·P·V. Boots no agents. Refuses to overwrite a standing cell."

# plant — the ONLY write path to question.md, and it is a human's hands.
# FAILS CLOSED: stdin not a TTY ⇒ refuse, exit 4. plugin.action.invoke over the
# socket therefore cannot plant a question — it can only ask a human to.
[[actions]]
id          = "plant"
title       = "Plant the question (human only)"
command     = ["/home/deploy/the-cell/plugin/bin/cell-plant"]
contexts    = ["global"]
description = "Open question.md for the human to write the live question. Refuses without a human at a keyboard."

# attest — records the human's confirmation of the desk standing at the gate,
# in state/gates.jsonl — never in question.md. Same TTY guard: an attestation
# typed by a machine is not an attestation.
[[actions]]
id          = "attest"
title       = "Attest the current gate"
command     = ["/home/deploy/the-cell/plugin/bin/cell-attest"]
contexts    = ["global", "pane"]
description = "Record the human's attestation of the desk now standing at the gate. Human TTY required."

# zoom — the holographic descent (XY := X within Y): a desk opens as its own cell.
# v1 reports the descent target and mutates nothing; free to be machine-invoked.
[[actions]]
id          = "zoom"
title       = "Zoom into a desk"
command     = ["/home/deploy/the-cell/plugin/bin/cell-zoom"]
contexts    = ["pane"]
description = "Descend into the focused desk as its own cell (holographic law). v1: reports the descent target, mutates nothing."

# ── deliberately absent ─────────────────────────────────────────────────────
# [[startup]]       — nothing in this cell may start unbidden.
# [[build]]         — the cell is declarative; there is nothing to compile.
# [[link_handlers]] — no URL surface at v1.
#
# ── the events: the conductor's ears (restored in v3 with a verified name) ───
# RawPluginManifestEventHook = 3 fields: on* · command* · platforms (optional).
# DOTTED namespace — see OPEN-5 in the header. `pane_agent_status_changed` (underscored) is the
# push-stream spelling and would be an unknown name here.
# The hook is a pure recorder: it writes state/desk-state.jsonl for the four desks of THIS
# workspace only, drops every other event unread — Amihai's w1 and his pi above all — never
# mutates anything, never touches question.md, and always exits 0. A hook is not a gate.
[[events]]
on      = "pane.agent_status_changed"
command = ["/home/deploy/the-cell/plugin/bin/cell-on-desk-state"]

# ── R08 bindings · the human's conduction actions (addendum, not a rewrite) ──
# Append these blocks to plugin/herdr-plugin-v4.toml (the v4 manifest stays
# byte-identical otherwise; `plant` / `attest` are unchanged — they are not
# re-declared here).  Each action's command is the seam itself — one
# `cellctl` subcommand per action, argv-only, never through a shell, no TTY
# guard (free gestures, like `begin`/`zoom`).  C1: one action = one cellctl
# call; the action adds nothing on top (C3).  C2: no write verb is exposed —
# `/states` is the only desk-facing read.  C8: each action is an independent
# stud; no action chains another, and the orchestration method stays the
# brick data the engine reads (word.json + spec.json + soft.json).
#
# DATA CONSTANTS (the paths below are manifest data, one place to change —
# K5; none of them are code):
#   CELLCTL  = /home/deploy/the-cell/rounds/R07-integration/authored/cellctl   (the seam, R07 canon 992b775)
#   CELL_SPEC    = /home/deploy/the-cell/rounds/R07-integration/authored/spec.json
#   CELL_WORD    = /home/deploy/the-cell/state/word.json                        (D2 open — the acceptance word is
#                                                                               Amihai's to plant; absent today, so
#                                                                               /word reads absent, honestly)
#   CELL_DECODED = /home/deploy/the-cell/state/decoded-scenario.json            (the declared handoff for the decoded
#                                                                               scenario — written by no binding; see
#                                                                               README — the engine reads it, or it is
#                                                                               absent, honestly)
#   CELL_LEDGER  = /home/deploy/the-cell/state/gates.jsonl
#   CELL_TRAIL   = /home/deploy/the-cell/state/trail.jsonl
#   MATERIALIZE_OUT = /home/deploy/the-cell/state/materialized
#
# Failure discipline (C6): when a data path is absent — word.json while D2 is
# open, the trail before the first run — the action forwards cellctl's honest
# absent/inconclusive report verbatim.  Never a substituted value, never a
# clean verdict, never a fixture stand-in.

# conduct — the composite run over the live desks (the load-bearing action).
[[actions]]
id          = "conduct"
title       = "Conduct — run the cell"
command     = ["/home/deploy/the-cell/rounds/R07-integration/authored/cellctl", "conduct", "--spec", "/home/deploy/the-cell/rounds/R07-integration/authored/spec.json"]
contexts    = ["global", "pane"]
description = "Run the conducted cycle over the live desks through the seam. The run lock is the seam's (C5); an open D2 reads INCONCLUSIVE, never a stand-in."

# word — decode the acceptance word (D2 open: absent reads absent).
[[actions]]
id          = "word"
title       = "Word — decode the scenario"
command     = ["/home/deploy/the-cell/rounds/R07-integration/authored/cellctl", "word", "--scenario", "/home/deploy/the-cell/state/word.json"]
contexts    = ["global"]
description = "Decode the acceptance word through the seam. Absent word.json reads absent honestly (D2 open — the word is Amihai's to plant)."

# plan — derive the sign-walk of the decoded scenario (the declared handoff
# file; absent reads absent).
[[actions]]
id          = "plan"
title       = "Plan — derive the sign-walk"
command     = ["/home/deploy/the-cell/rounds/R07-integration/authored/cellctl", "plan", "/home/deploy/the-cell/state/decoded-scenario.json"]
contexts    = ["global"]
description = "Derive the sign-walk of the decoded scenario through the seam. Pure — no socket, no ledger."

# materialize — emit the decoded word's child cells.
[[actions]]
id          = "materialize"
title       = "Materialize — emit the child cells"
command     = ["/home/deploy/the-cell/rounds/R07-integration/authored/cellctl", "materialize", "/home/deploy/the-cell/state/decoded-scenario.json", "--out", "/home/deploy/the-cell/state/materialized"]
contexts    = ["global"]
description = "Emit each node's child cell through the seam (the engine's own materializer; the write path is the engine's, not the action's)."

# states — the desks' real states, read-only (the only desk-facing surface).
[[actions]]
id          = "states"
title       = "States — read the desks"
command     = ["/home/deploy/the-cell/rounds/R07-integration/authored/cellctl", "states", "--spec", "/home/deploy/the-cell/rounds/R07-integration/authored/spec.json"]
contexts    = ["global", "pane"]
description = "Read each desk's real state through the seam. Read-only; an absent socket reads {\"status\":\"absent\"} honestly."

# trail — the human's window into the formation trail.
[[actions]]
id          = "trail"
title       = "Trail — read the formation trail"
command     = ["/home/deploy/the-cell/rounds/R07-integration/authored/cellctl", "trail", "--ledger", "/home/deploy/the-cell/state/gates.jsonl", "--trail", "/home/deploy/the-cell/state/trail.jsonl"]
contexts    = ["global", "pane"]
description = "Read the readable trail and the dependency audit through the seam. Absent/empty/damaged reads its honest status."

# descent — REMOVED at deployment (2026-08-31): the fixed gesture `path-between
# --from "" --to V` needs an EMPTY address (the centre), which herdr's manifest
# validator refuses ("command must contain non-empty argv strings"). The descent
# capability is preserved in the conductor's pi-cell `descent` slash tool, which
# passes the empty centre at runtime through the pi tool param (not the manifest).

# config — read the soft config (read-only; absent = the declared defaults).
[[actions]]
id          = "config"
title       = "Config — read the soft config"
command     = ["/home/deploy/the-cell/rounds/R07-integration/authored/cellctl", "config"]
contexts    = ["global"]
description = "Read the soft config through the seam. Absent file reads the engine's declared defaults, honestly."
