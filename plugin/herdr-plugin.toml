# ONE CATCH CAUGHT BEFORE LINKING (why the draft would have failed validation):
#   the draft podium pane carried width = "30%" together with placement = "split".
#   The binary's validator says verbatim: "pane width and height are only supported
#   when placement is popup" → the draft would have died on invalid_plugin_pane_size.
#   width/height are GONE from this file. The podium's 30% comes from geometry instead:
#   the plugin pane is born inside the interim podium's own column and inherits that
#   area when the interim one closes. No layout.set_split_ratio is needed — and that
#   verb was not attested.
#
# LAW ENCODED HERE:
#   podium = plugin-owned, no shell                    (sealed center)
#   plant / attest = fail closed without a human TTY   (DC-02, by construction)
#   begin / zoom  = freely machine-invokable           (free corners)
#   no startup, no build, no link_handlers             (nothing autonomous)
#   nothing in this manifest names workspace w1        (Amihai's session, untouched)

# ── identity (flat, and the identity key is `id` — settled by the parser itself) ──────
# `id` is what the TOML parse model requires; the API reports the same value back as
# `plugin_id` in InstalledPluginInfo. Do not add a second `plugin_id` key here: the parser
# ignores keys it does not know, so it would sit in the file looking authoritative and
# meaning nothing. One name in, one name out, and this comment is the bridge between them.
id                = "cell.fiveqln"
name              = "The Cell — 4+1"
version           = "1.0.0"
description       = "The 4+1 cell as a Herdr instrument: a sealed podium holding the human's question, four free desks G·Q·P·V, and the actions that raise, plant, attest and descend."
min_herdr_version = "0.8.2"   # must be <= 0.8.2 (binary carries the literal threshold)
platforms         = ["linux"] # PluginPlatform enum: linux | macos | windows

# ── the podium: the sealed center ───────────────────────────────────────────
# PluginManifestPane: id* · title* · command* · description · placement · width · height · platforms
# The command is BYTE-IDENTICAL to the live interim podium verified 2026-08-24 via
# pane.process_info (foreground = `watch`, no shell). Taking plugin ownership adds
# no new process risk: the seal proven for w2:p2 carries over unchanged.
# It renders question.md ONLY. Gate state deliberately does not appear here — the
# center holds the question, nothing else.
# NO width/height: they are popup-only (see "ONE CATCH" above).
[[panes]]
id          = "podium"
title       = "THE QUESTION"
command     = ["watch", "-n", "2", "cat", "/home/deploy/the-cell/question.md"]
placement   = "split"   # PluginPanePlacement: overlay | popup | split | tab | zoomed
description = "SEALED. The live question, planted by the human alone. No shell lives here."

# ── the actions: the score's four gestures ──────────────────────────────────
# PluginManifestAction: id* · title* · command* · description · contexts · platforms
# PluginActionContext enum (verified): global | workspace | tab | pane | selection
# Every command is an absolute path inside plugin_root/bin — nothing depends on cwd.

# begin — raise the cell. Machine-invokable (a free corner gesture).
# Resolves the workspace by LABEL "the-cell"; REFUSES to re-apply a layout over a
# cell that is already standing (layout.apply replaces the tab and would kill the
# plugin podium). Never passes focus:true. Never names w1. Boots no agents.
[[actions]]
id          = "begin"
title       = "Begin — raise the cell"
command     = ["/home/deploy/the-cell/plugin/bin/cell-begin"]
contexts    = ["global"]
description = "Raise the 4+1 cell in its own workspace: podium + desks G·Q·P·V. Boots no agents. Refuses to overwrite a standing cell."

# plant — the ONLY write path to question.md, and it is a human's hands.
# FAILS CLOSED: stdin not a TTY ⇒ refuse, exit 4. plugin.action.invoke over the
# socket therefore cannot plant a question — it can only ask a human to.
[[actions]]
id          = "plant"
title       = "Plant the question (human only)"
command     = ["/home/deploy/the-cell/plugin/bin/cell-plant"]
contexts    = ["global"]
description = "Open question.md for the human to write the live question. Refuses without a human at a keyboard."

# attest — records the human's confirmation of the desk standing at the gate,
# in state/gates.jsonl — never in question.md. Same TTY guard: an attestation
# typed by a machine is not an attestation.
[[actions]]
id          = "attest"
title       = "Attest the current gate"
command     = ["/home/deploy/the-cell/plugin/bin/cell-attest"]
contexts    = ["global", "pane"]
description = "Record the human's attestation of the desk now standing at the gate. Human TTY required."

# zoom — the holographic descent (XY := X within Y): a desk opens as its own cell.
# v1 reports the descent target and mutates nothing; free to be machine-invoked.
[[actions]]
id          = "zoom"
title       = "Zoom into a desk"
command     = ["/home/deploy/the-cell/plugin/bin/cell-zoom"]
contexts    = ["pane"]
description = "Descend into the focused desk as its own cell (holographic law). v1: reports the descent target, mutates nothing."


# ── deliberately absent ─────────────────────────────────────────────────────
# [[startup]]       — nothing in this cell may start unbidden.
# [[build]]         — the cell is declarative; there is nothing to compile.
# [[link_handlers]] — no URL surface at v1.
# [[events]]        — WITHHELD, not abandoned: see OPEN-5 in the header. The conductor's ears
#                     wait for one verified event name rather than a plausible one. When it
#                     returns it is exactly:
#                       [[events]]
#                       on      = "<the verified spelling>"
#                       command = ["/home/deploy/the-cell/plugin/bin/cell-on-desk-state"]
